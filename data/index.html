<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080807">
<title>GuardianAngel Parent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="parent">
<header>
  <h1>
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5 19 5.5v5.7c0 4.6-2.9 7.8-7 9.3-4.1-1.5-7-4.7-7-9.3V5.5l7-3Z"/>
        <path d="m8.6 11.8 2.2 2.2 4.4-4.5"/>
      </svg>
    </span>
    <span class="brand-name">GuardianAngel</span>
    <span class="muted tag">parent</span>
  </h1>
  <nav>
    <a href="/teacher">Teacher</a>
    <button id="themeToggle" class="theme-toggle" type="button">Gold &amp; White</button>
  </nav>
</header>
<p id="link" class="status muted">Connecting&hellip;</p>
<div id="highAlert" class="high-alert" hidden>High Alert!</div>

<main class="grid">
  <div class="card wide hero">
    <div class="hero-top">
      <div class="label">Child's safety</div>
      <button id="resetTrip" class="reset-btn" type="button">RESET</button>
    </div>
    <p id="overall" class="v">--</p>
    <p id="overallSub" class="sub muted"></p>
    <p id="arrival" class="arrival">Waiting for the school to confirm arrival</p>
  </div>

  <div class="card wide" id="homeCard" hidden>
    <div class="label">Home arrival</div>
    <p id="homeStatus" class="v small">Your child has been sent back from school.</p>
    <button id="homeArrive" class="big-btn" type="button">Confirm my child reached home safely</button>
  </div>

  <div class="card">
    <div class="label">Temperature</div>
    <div id="temp" class="v">--</div>
    <div class="temprow">
      <span id="tempval" class="tempval">--</span>
      <div class="tempbar"><div id="tempfill" class="tempfill"></div></div>
    </div>
  </div>

  <div class="card">
    <div class="label">Smoking</div>
    <div id="smoke" class="v">--</div>
    <p id="smokeSub" class="sub muted"></p>
  </div>

  <div class="card">
    <div class="label">Any problem?</div>
    <div id="problem" class="v">--</div>
    <p id="problemSub" class="sub muted"></p>
  </div>

  <div class="card">
    <div class="label">Speed</div>
    <div id="speed" class="v">--</div>
    <p id="speedSub" class="sub muted"></p>
  </div>

  <div class="card">
    <div class="label">Comfort</div>
    <div id="comfort" class="v">--</div>
    <p id="comfortSub" class="sub muted"></p>
  </div>

  <div class="card wide">
    <div class="label">Child's location</div>
    <div id="location" class="v small">--</div>
    <p id="locationSub" class="muted"></p>
  </div>

  <div class="card wide">
    <div class="label">What happened</div>
    <ul class="alerts" id="alerts"><li class="muted">Nothing yet</li></ul>
  </div>
</main>

<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
